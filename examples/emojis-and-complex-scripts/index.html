<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Example - Emojis and complex scripts</title>
</head>
<body>

  <div id="typewriter"></div>

  <script src='../../dist/core.js'></script>
  <script type="text/javascript">
    const typewriter = new Typewriter('#typewriter', {
      loop: true,
      useGraphemeSplitter: true,
      mergeTextNodes: true,
      pasteAsCharacters: true,
      onlyDelayVisibleChanges: true,
      delay: { min: 60, max: 120 },
    });

    typewriter
      .typeString('Family: 👨‍👩‍👧 Flag: 🇬🇧 Café')
      .pauseFor(1000)
      .deleteChars(4)
      .typeString('Thai: สวัสดีครับ')
      .pauseFor(1000)
      .typeString('<br>Arabic: <span dir="rtl">مرحبا بالعالم</span>')
      .pauseFor(1000)
      .pasteString(' Pasted text')
      .deleteChars(5)
      .pauseFor(2000)
      .start();
  </script>

</body>
</html>
