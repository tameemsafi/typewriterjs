<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Example - Skip and clear</title>
</head>
<body>

  <button id="skip">Skip</button>
  <button id="clear">Clear</button>
  <button id="restart">Type something else</button>

  <div id="typewriter"></div>

  <script src='../../dist/core.js'></script>
  <script type="text/javascript">
    const typewriter = new Typewriter('#typewriter', {
      delay: 75,
    });

    typewriter
      .typeString('This is a long sentence that takes a while to type out.')
      .pauseFor(1000)
      .typeString(' <strong>Click skip to see all of it now.</strong>')
      .start();

    document.getElementById('skip').addEventListener('click', () => {
      typewriter.skipToEnd();
    });

    document.getElementById('clear').addEventListener('click', () => {
      typewriter.clearQueue().clear().start();
    });

    document.getElementById('restart').addEventListener('click', () => {
      typewriter
        .clearQueue()
        .deleteAll(10)
        .typeString('Something else!')
        .start();
    });
  </script>

</body>
</html>
